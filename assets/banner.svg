<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .floating-card { animation: float 6s ease-in-out infinite; }
    .floating-card-delayed { animation: float 6s ease-in-out infinite 3s; }
    .pulse-grid { animation: pulse 4s ease-in-out infinite alternate; }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { opacity: 0.15; }
      100% { opacity: 0.35; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid Lines (Dynamic aspect) -->
  <g stroke="#38bdf8" stroke-width="0.5" class="pulse-grid">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="350" y1="0" x2="350" y2="320"/>
    <line x1="550" y1="0" x2="550" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
    <line x1="950" y1="0" x2="950" y2="320"/>
    <line x1="1150" y1="0" x2="1150" y2="320"/>
  </g>

  <!-- Dynamic Animated Floating Cards in Background -->
  <g class="floating-card">
    <rect x="850" y="45" width="280" height="90" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <circle cx="885" cy="90" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M885 80 L885 100 M875 90 L895 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="915" y="82" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">GIS Plot Mapping</text>
    <text x="915" y="102" font-family="sans-serif" font-size="12" fill="#94a3b8">Interactive Spatial Records</text>
  </g>

  <g class="floating-card-delayed">
    <rect x="880" y="165" width="260" height="90" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <circle cx="915" cy="210" r="16" fill="#818cf8" fill-opacity="0.2"/>
    <path d="M907 210 L913 216 L923 204" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="945" y="202" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Burial & Genealogy</text>
    <text x="945" y="222" font-family="sans-serif" font-size="12" fill="#94a3b8">Searchable Digital Archives</text>
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="100" cy="80" r="90" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="260" r="110" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Main Content Foreground (Unobscured Title & Subtitle) -->
  <g transform="translate(60, 0)">
    <!-- Icon / Badge Pill -->
    <rect x="0" y="52" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="73" class="badge-text">🪦 CEMETERY TECH</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Cemetery Management</text>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">A curated collection of SaaS platforms, GIS plot mapping tools &amp; open-source record systems</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="14" y="20" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">🌐 SaaS Platforms</text>

      <rect x="142" y="0" width="150" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="156" y="20" font-family="sans-serif" font-size="13" fill="#818cf8" font-weight="600">💻 Open-Source Repos</text>

      <rect x="304" y="0" width="140" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="318" y="20" font-family="sans-serif" font-size="13" fill="#c084fc" font-weight="600">🗺️ GIS &amp; Genealogy</text>
    </g>
  </g>
</svg>
